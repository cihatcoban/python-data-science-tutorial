name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Code Quality & Linting (Ruff)
        run: |
          ruff check src tests

      - name: Code Formatting Check
        run: |
          ruff format --check src tests

      - name: Run Test Suite (Pytest)
        run: |
          pytest tests/ -v --cov=src/datascience_toolbox --cov-report=xml

      - name: Validate Notebook Syntaxes
        run: |
          python -c "
          import json, glob
          for nb_file in glob.glob('notebooks/**/*.ipynb', recursive=True):
              with open(nb_file, 'r', encoding='utf-8') as f:
                  data = json.load(f)
                  assert 'cells' in data, f'Corrupted notebook: {nb_file}'
          print('All notebooks validated successfully!')
          "
